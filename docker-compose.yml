services:
  # ==========================================
  # 1. Backend Service: .NET 10 Web API
  # ==========================================
  backend:
    build:
      context: ./backend/CongBarber.Api
      dockerfile: Dockerfile
    container_name: congbarber-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5012
      - DB_PATH=/app/data/congbarber.db
    ports:
      - "5012:5012"
    volumes:
      # Sử dụng named volume để tránh lỗi Disk I/O SQLite trên Docker và bảo toàn dữ liệu bán hàng
      - congbarber-data:/app/data
    networks:
      - congbarber-network

  # ==========================================
  # 2. Frontend Service: Vue 3 + Nginx Reverse Proxy
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: congbarber-frontend
    restart: unless-stopped
    ports:
      - "80:80"       # Cổng HTTP chuẩn
      - "5173:80"     # Cổng phát triển tiện ích
    depends_on:
      - backend
    networks:
      - congbarber-network

# ==========================================
# Cấu hình Network & Persistent Volume
# ==========================================
networks:
  congbarber-network:
    driver: bridge

volumes:
  congbarber-data:
    driver: local
