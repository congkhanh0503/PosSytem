services:
  # ==========================================
  # 1. Backend Service: .NET 10 Web API
  # ==========================================
  backend:
    build:
      context: ./backend/DiroPos.Api
      dockerfile: Dockerfile
    container_name: diropos-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5012
      - DB_PATH=/app/data/diropos.db
      - LICENSE_SERVER_URL=http://host.docker.internal:5020/api/remote-license
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5012:5012"
    volumes:
      # Sử dụng named volume để tránh lỗi Disk I/O SQLite trên Docker và bảo toàn dữ liệu bán hàng
      - diropos-data:/app/data
    networks:
      - diropos-network

  # ==========================================
  # 2. Frontend Service: Vue 3 + Nginx Reverse Proxy
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diropos-frontend
    restart: unless-stopped
    ports:
      - "80:80"       # Cổng HTTP chuẩn
      - "5173:80"     # Cổng phát triển tiện ích
    depends_on:
      - backend
    networks:
      - diropos-network

# ==========================================
# Cấu hình Network & Persistent Volume
# ==========================================
networks:
  diropos-network:
    driver: bridge

volumes:
  diropos-data:
    driver: local
